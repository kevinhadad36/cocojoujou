<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CocoJoujou — L'espace jeux des petits musulmans</title>
<meta name="description" content="CocoJoujou : l'espace jeux des enfants musulmans. Lettres arabes, mémoire, ballons, quiz et coloriage, avec des étoiles à gagner.">
<meta property="og:title" content="CocoJoujou — L'espace jeux des petits musulmans">
<meta property="og:description" content="Des jeux colorés pour apprendre en s'amusant, pas à pas et avec le sourire.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='42' r='34' fill='%23FF86D0'/%3E%3Cpath d='M50 76l-6 14h12z' fill='%23FF86D0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4b4b4b;--muted:#8a8a8a;--line:#e5e5e5;--bg:#fff;--head:#3c3c3c;
  --green:#58cc02;--green-l:#46a302;--blue:#1cb0f6;--blue-l:#1899d6;--yellow:#ffc800;--yellow-l:#e5b400;
  --red:#ff4b4b;--red-l:#ea2b2b;--purple:#ce82ff;--purple-l:#a568cc;--orange:#ff9600;--orange-l:#e08600;--pink:#ff86d0;--pink-l:#e060b0;--teal:#00cd9c;--teal-l:#00a97f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,system-ui,sans-serif;font-weight:700;color:var(--ink);background:var(--bg);line-height:1.45;overflow-x:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{color:var(--head);font-weight:900;line-height:1.1}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:12px}
svg{display:block}
.hide{display:none!important}

/* boutons */
.btn{--c:var(--green);--l:var(--green-l);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 24px;border-radius:16px;background:var(--c);color:#fff;font-weight:900;font-size:15px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 0 var(--l);transition:transform .08s,box-shadow .08s,filter .1s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:none}
.btn.sm{min-height:42px;padding:8px 16px;font-size:13px;border-radius:14px}
.btn.blue{--c:var(--blue);--l:var(--blue-l)}
.btn.red{--c:var(--red);--l:var(--red-l)}
.btn.orange{--c:var(--orange);--l:var(--orange-l)}

/* logo */
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:26px;letter-spacing:-.5px}
.logo svg{width:34px;height:40px;flex:none}
.logo span b:nth-child(1){color:var(--pink)}.logo span b:nth-child(2){color:var(--orange)}.logo span b:nth-child(3){color:var(--green)}.logo span b:nth-child(4){color:var(--blue)}.logo span b:nth-child(5){color:var(--purple)}.logo span b:nth-child(6){color:var(--red)}.logo span b:nth-child(7){color:var(--teal)}.logo span b:nth-child(8){color:var(--yellow-l)}.logo span b:nth-child(9){color:var(--pink)}
.logo small{display:block;font-size:12px;color:var(--green-l);letter-spacing:0;font-weight:800;margin-top:-2px}

/* ===== ACCUEIL ===== */
.top{position:sticky;top:0;z-index:30;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:22px}
.top nav{display:flex;gap:6px;margin-right:auto;margin-left:18px}
.top nav a{padding:8px 14px;border-radius:12px;font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.top nav a:hover{background:#f4f4f4;color:var(--ink)}
.top .acts{display:flex;gap:10px;align-items:center}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

.hero{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center;padding:48px 18px 20px;max-width:1120px;margin:0 auto}
.chip{display:inline-block;border:2px solid var(--line);border-radius:99px;padding:6px 16px;font-weight:900;font-size:14px;background:#fff;box-shadow:0 3px 0 var(--line)}
.rb b:nth-child(4n+1){color:var(--pink)}.rb b:nth-child(4n+2){color:var(--orange)}.rb b:nth-child(4n+3){color:var(--green)}.rb b:nth-child(4n){color:var(--blue)}
.hero h1{font-size:clamp(34px,5vw,52px);margin:18px 0 12px;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{font-size:19px;max-width:470px;margin-bottom:24px;color:var(--ink)}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap}
.scene{position:relative;aspect-ratio:1.15;max-width:520px;margin-left:auto;width:100%}
.scene .blob{position:absolute;inset:6% 4% 0;background:radial-gradient(circle at 30% 30%,#dff4ff,#fff2c9 60%,#ffe0f1);border-radius:46% 54% 50% 50%/55% 50% 50% 45%}
.scene .ground{position:absolute;left:4%;right:4%;bottom:2%;height:11%;background:var(--green);border-radius:50%;opacity:.9;box-shadow:inset 0 -8px 0 var(--green-l)}
.scene .k{position:absolute;bottom:8%}
.scene .k1{left:3%;width:30%}.scene .k2{left:30%;width:40%;bottom:10%}.scene .k3{right:2%;width:32%}
.scene .bl{position:absolute;animation:bob 4s ease-in-out infinite}
.scene .tile{position:absolute;width:15%;aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font:700 clamp(28px,4.4vw,52px)/1 "Noto Naskh Arabic",serif;color:#fff;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.star{position:absolute;color:var(--yellow);font-size:26px;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.3) rotate(15deg);opacity:.6}}

.sec{padding:46px 0 0}
.sec h2{font-size:clamp(28px,4vw,38px);margin-bottom:6px}
.sec .sub{margin-bottom:22px;font-size:17px}

/* rubriques + cartes de jeux */
.rub{display:inline-flex;align-items:center;gap:8px;margin:26px 0 12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:#fff;padding:5px 14px;border-radius:99px;background:var(--c);box-shadow:0 3px 0 var(--l)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.gc{--c:var(--yellow);--l:var(--yellow-l);display:flex;align-items:center;gap:16px;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:14px 16px;position:relative;overflow:hidden;transition:transform .12s,border-color .12s,background .12s}
.gc:before{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.14}
.gc:hover{border-color:var(--c);background:#fffdf7;transform:translateY(-2px)}
.gc:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.gc .ico{flex:none;width:68px;height:68px;border-radius:18px;background:var(--c);box-shadow:0 5px 0 var(--l);display:grid;place-items:center;color:#fff;font:700 38px/1 "Noto Naskh Arabic",serif}
.gc .ico.em{font:400 34px/1 Nunito,sans-serif}
.gc h3{font-size:19px;margin-bottom:2px}
.gc p{font-size:14px;color:var(--muted);font-weight:700;line-height:1.3}
.gc .face{margin-left:auto;flex:none;width:52px;height:56px;position:relative;z-index:1}
.gc .done{position:absolute;right:12px;bottom:8px;font-size:13px;font-weight:900;color:var(--yellow-l)}

/* copains */
.crew{background:linear-gradient(180deg,#f0fbff,#fff6e0);border:2px solid var(--line);border-radius:28px;padding:30px 18px 0;margin-top:46px;overflow:hidden;position:relative}
.crew h2{text-align:center}.crew .sub{text-align:center}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-items:end;max-width:900px;margin:0 auto}
.row figure{margin:0;text-align:center}
.row figure svg{transition:transform .2s}
.row figure:hover svg{transform:translateY(-8px) rotate(-3deg)}
.row figcaption{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:99px;padding:1px 12px;font-weight:900;font-size:14px;margin:2px 0 14px}
footer.ft{margin-top:50px;border-top:2px solid var(--line);padding:26px 18px 90px;text-align:center;color:var(--muted);font-size:14px}

/* ===== ESPACE ===== */
.hd{position:sticky;top:0;z-index:30;background:#fff;border-bottom:2px solid var(--line)}
.hd .in{max-width:1120px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.hd .sp{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:900;color:var(--yellow-l);background:#fff;box-shadow:0 3px 0 var(--line)}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.2) rotate(-4deg)}}
.me{width:46px;height:46px;border-radius:50%;background:var(--yellow);box-shadow:0 3px 0 var(--yellow-l);overflow:hidden;flex:none}
.me svg{width:100%;height:100%}
.shell{max-width:1120px;margin:0 auto;padding:22px 18px 40px;display:grid;grid-template-columns:230px 1fr;gap:34px}
.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:6px}
.side a{display:flex;align-items:center;gap:14px;padding:8px 12px;border:2px solid transparent;border-radius:16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:15px;color:var(--ink)}
.side a:hover{background:#f6f6f6}
.side a.on{border-color:var(--orange);background:#fff3e0;color:var(--orange-l)}
.side .si{width:40px;height:40px;border-radius:12px;background:var(--c);box-shadow:0 3px 0 var(--l);display:grid;place-items:center;font-size:20px}
.banner{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#fff3e0,#ffe8f4 60%,#e5f6ff);border:2px solid var(--orange);border-radius:22px;padding:18px 20px;margin-bottom:6px;position:relative;overflow:hidden}
.banner h1{font-size:30px}
.banner p{margin-top:4px}
.banner .bk{margin-left:auto;display:flex;align-items:flex-end;gap:2px;flex:none}
.banner .bk svg{width:64px}
.banner .bb{position:absolute;animation:bob 4s ease-in-out infinite;opacity:.95}
.card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:22px}

/* jeu */
.play{max-width:720px;margin:0 auto;width:100%}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ph h1{font-size:22px;flex:1;text-align:center}
.round{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;box-shadow:0 3px 0 var(--line);font-size:20px;display:grid;place-items:center;color:var(--muted)}
.prog{height:16px;border-radius:99px;background:#e5e5e5;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s;position:relative}
.prog i:after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:#ffffff55}
.stage{text-align:center;min-height:340px;padding:24px 18px}
.q{font-size:clamp(20px,3.4vw,26px);font-weight:900;color:var(--head);margin-bottom:16px}
.big{font:700 clamp(84px,18vw,130px)/1.25 "Noto Naskh Arabic",serif;color:var(--purple-l);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:440px;margin:0 auto}
.tiles.t3{grid-template-columns:repeat(3,1fr);max-width:480px}
.opt{--c:var(--blue);--l:var(--blue-l);min-height:92px;border-radius:20px;background:var(--c);box-shadow:0 5px 0 var(--l);color:#fff;font:700 54px/1.1 "Noto Naskh Arabic",serif;display:grid;place-items:center;padding:6px;transition:transform .08s,box-shadow .08s,opacity .2s}
.opt.txt{font:900 26px/1.1 Nunito,sans-serif}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:none}
.opt:disabled{cursor:default}
.opt.faded{opacity:.35}
.opt.good{outline:5px solid var(--green);outline-offset:3px}
.opt.bad{animation:shake .4s;outline:5px solid var(--red);outline-offset:3px}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.list{display:grid;gap:12px;max-width:520px;margin:0 auto}
.lopt{min-height:60px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:#fff;font-weight:900;font-size:19px;color:var(--head);padding:10px 18px;text-align:left;display:flex;align-items:center;gap:12px;transition:transform .08s}
.lopt:hover:not(:disabled){background:#f0faff;border-color:var(--blue)}
.lopt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.lopt.good{background:#d7ffb8;border-color:var(--green);color:#2b7a00}
.lopt.bad{background:#ffdfe0;border-color:var(--red);color:#b32020;animation:shake .4s}
.fb{position:sticky;bottom:0;margin:18px -4px 0;padding:16px 20px;border-radius:20px;display:none;align-items:center;gap:14px;flex-wrap:wrap;animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.fb.show{display:flex}
.fb.ok{background:#d7ffb8;color:#3f8f00}.fb.no{background:#ffdfe0;color:#c42b2b}
.fb b{font-size:21px;display:block}
.fb .t{flex:1;min-width:160px;text-align:left}
.fb .t span{font-weight:800;font-size:15px}

/* fin */
.end h2{font-size:34px;margin:10px 0 4px;color:var(--green-l)}
.end .kid{width:150px;margin:0 auto}
.end .won{display:inline-flex;gap:8px;align-items:center;margin:12px 0 20px;font-size:26px;font-weight:900;color:var(--yellow-l);border:2px solid var(--line);border-radius:18px;padding:8px 20px}
.end .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* mémoire */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:0 auto}
.mt{aspect-ratio:1;position:relative;perspective:600px}
.mt i{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;transition:transform .4s;font-style:normal}
.mt .fr{background:var(--c);box-shadow:0 5px 0 var(--l);color:#fff;font-size:30px;font-weight:900}
.mt .bk{background:#fff;border:3px solid var(--line);font-size:clamp(30px,9vw,46px);transform:rotateY(180deg)}
.mt.on .fr{transform:rotateY(180deg)}.mt.on .bk{transform:rotateY(0)}
.mt.m .bk{background:#d7ffb8;border-color:var(--green)}
.msg{font-weight:900;font-size:18px;margin-top:14px;color:var(--muted)}

/* ballons */
.sky{position:relative;height:330px;background:linear-gradient(#cdeeff,#fff);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.pb{position:absolute;width:76px;animation:bob 3s ease-in-out infinite}
.pb span{position:absolute;left:0;right:0;top:12px;text-align:center;font:900 30px Nunito;color:#fff;text-shadow:0 2px 0 #0005}
.pb.gone{animation:none;transform:scale(1.6);opacity:0;transition:.3s}
.pb.wr{animation:shake .4s}

/* couleurs */
.pal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.sw{width:48px;height:48px;border-radius:50%;box-shadow:0 4px 0 #0003}
.sw.sel{outline:4px solid var(--head);outline-offset:3px}
.paint{width:100%;max-width:400px;height:auto;margin:0 auto}
.paint .pt{cursor:pointer;transition:fill .2s}

/* wudu */
.steps{display:grid;gap:10px;max-width:520px;margin:0 auto}
.stp .n{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:none;place-items:center;flex:none;font-weight:900}
.stp.good .n{display:grid}

/* suivi */
.big-num{font-size:54px;font-weight:900;color:var(--yellow-l);display:flex;align-items:center;gap:10px}
.bar{height:20px;border-radius:99px;background:#e5e5e5;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .6s}
.medals{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.md{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:#f0f0f0;filter:grayscale(1);opacity:.5}
.md.on{background:#fff3c4;filter:none;opacity:1;box-shadow:0 4px 0 var(--yellow-l)}
.stat{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:2px solid var(--line)}
.stat:last-child{border:0}
.stat .ico{width:46px;height:46px;border-radius:14px;background:var(--c);box-shadow:0 3px 0 var(--l);display:grid;place-items:center;color:#fff;font:700 24px "Noto Naskh Arabic",serif}
.stat .ico.em{font:400 22px Nunito}
.stat div:nth-child(2){flex:1}.stat small{color:var(--muted);font-size:14px}
.av{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.avb{border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:8px 4px 6px;background:#fff;text-align:center;font-weight:900}
.avb svg{width:78%;margin:0 auto}
.avb.on{border-color:var(--green);background:#f1ffe3}
.inp{width:100%;max-width:320px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;margin-top:8px;background:#fff;color:var(--head)}
.inp:focus{outline:3px solid #bde6ff;border-color:var(--blue)}

/* confettis */
.cf{position:fixed;top:-30px;z-index:99;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* barre mobile */
.tab{display:none}
@media(max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:28px}
  .scene{margin:0 auto}
  .top nav{display:none}
  .shell{grid-template-columns:1fr;padding-top:14px}
  .side{display:none}
  .tab{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:2px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .tab a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 14px;border-radius:14px;font-size:12px;font-weight:900;text-transform:uppercase;color:var(--muted)}
  .tab a.on{color:var(--orange-l);background:#fff3e0}
  .tab .si{font-size:22px}
  .shell{padding-bottom:100px}
  .row{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .logo{font-size:22px}.logo small{display:none}
  .top .in{gap:10px}.top .acts .ghost{display:none}
  .banner{padding:14px}.banner h1{font-size:24px}.banner .bk svg{width:48px}
  .stage{padding:18px 10px}
  .tiles.t3{grid-template-columns:1fr}
  .av{grid-template-columns:repeat(2,1fr)}
  .opt{font-size:46px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ outils ============ */
const $=(s,r=document)=>r.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const COL=[['green','#58cc02','#46a302'],['blue','#1cb0f6','#1899d6'],['yellow','#ffc800','#e5b400'],['red','#ff4b4b','#ea2b2b'],['purple','#ce82ff','#a568cc'],['orange','#ff9600','#e08600'],['pink','#ff86d0','#e060b0'],['teal','#00cd9c','#00a97f']];
const cv=(i)=>`--c:${COL[i%COL.length][1]};--l:${COL[i%COL.length][2]}`;
const cvn=(n)=>{const c=COL.find(x=>x[0]===n);return `--c:${c[1]};--l:${c[2]}`};

let S={stars:0,stats:{},name:'',av:'amina'};
try{Object.assign(S,JSON.parse(localStorage.getItem('cj2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cj2',JSON.stringify(S))}catch(e){}};
const MEDALS=[[1,'🌱'],[5,'🐣'],[12,'🦋'],[25,'🌈'],[45,'🚀'],[70,'👑']];

/* ============ enfants SVG (toutes teintes de peau, visages doux) ============ */

function kid(o,vb){

  const cheeks=`<circle cx="46" cy="61" r="5" fill="#FF7A8A" opacity=".45"/><circle cx="74" cy="61" r="5" fill="#FF7A8A" opacity=".45"/>`;
  const O='#3c3c3c';let head,back='',front='';
  if(hijab){
    back=`<path d="M60 14C36 14 30 36 31 56c1 18 -6 38 -4 58h66c2-20-5-40-4-58 1-20-5-42-29-42z" fill="${hijab}" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/>`;
    head=`<ellipse cx="60" cy="55" rx="23" ry="25" fill="${skin}" stroke="${O}" stroke-width="3.5"/>`;
    front=`<path d="M36 50c2-22 14-28 24-28s22 6 24 28c-6-9-14-13-24-13s-18 4-24 13z" fill="${hijab}"/>`;
  }else{
    let h;
    if(style==='curly')h=`<g fill="${hair}" stroke="${O}" stroke-width="3"><circle cx="38" cy="38" r="13"/><circle cx="52" cy="26" r="14"/><circle cx="70" cy="26" r="14"/><circle cx="84" cy="38" r="13"/><circle cx="60" cy="30" r="14"/></g>`;
    else if(style==='cap')h=`<path d="M36 46c0-18 10-26 24-26s24 8 24 26z" fill="#fff" stroke="${O}" stroke-width="3.5"/><path d="M38 38h44M40 30h40" stroke="#ff9600" stroke-width="3" opacity=".8"/>`;
    else h=`<path d="M35 52c-2-22 9-34 25-34s27 12 25 34c-5-10-12-15-25-15s-20 5-25 15z" fill="${hair}" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/>`;
    head=`<ellipse cx="60" cy="55" rx="23" ry="25" fill="${skin}" stroke="${O}" stroke-width="3.5"/>`;front=h;
  }
  const body=dress?`<path d="M42 82h36l10 56H32z" fill="${top}" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/><path d="M38 128h44M35 116h50" stroke="#fff" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" opacity=".8"/>`
    :`<rect x="40" y="80" width="40" height="40" rx="12" fill="${top}" stroke="${O}" stroke-width="3.5"/><path d="M42 118h14v34H42zM64 118h14v34H64z" fill="${bottom}" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/>`;
  const legs=dress?`<rect x="45" y="136" width="12" height="18" rx="5" fill="${skin}" stroke="${O}" stroke-width="3.5"/><rect x="63" y="136" width="12" height="18" rx="5" fill="${skin}" stroke="${O}" stroke-width="3.5"/>`:'';
  const shoes=`<ellipse cx="49" cy="157" rx="11" ry="6" fill="#ffc800" stroke="${O}" stroke-width="3.5"/><ellipse cx="71" cy="157" rx="11" ry="6" fill="#ffc800" stroke="${O}" stroke-width="3.5"/>`;
  const arm=(d,hx,hy)=>`<path d="${d}" stroke="${O}" stroke-width="13" stroke-linecap="round" fill="none"/><path d="${d}" stroke="${top}" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="${hx}" cy="${hy}" r="7" fill="${skin}" stroke="${O}" stroke-width="3"/>`;
  const aL=arm("M42 88c-10 6-14 16-12 26",30,117);
  const aR=wave?arm("M78 88c12-2 20-12 20-26",98,58):arm("M78 88c10 6 14 16 12 26",90,117);
  return `<svg viewBox="${vb||'0 0 120 166'}" aria-hidden="true">${back}${legs}${body}${shoes}${aL}${aR}<rect x="53" y="74" width="14" height="12" rx="5" fill="${skin}"/>${head}${front}${cheeks}</svg>`;

let cur=null;
function gameShell(id,bodyHTML){
  const g=G[id];

const prog=f=>{const p=$('#pg');if(p)p.style.width=Math.round(f*100)+'%'};
function finish(id,earned,opts={}){
  const st=S.stats[id]||{plays:0,best:0};st.plays++;st.best=Math.max(st.best,earned);S.stats[id]=st;addStars(earned);save();prog(1);
  const fb=$('#fb');fb.className='fb';
  const k=pick(Object.keys(KIDS),1)[0];
  $('#stage').innerHTML=`<div class="end"><div class="kid">${K(k).replace('<svg','<svg style="width:100%"')}</div><h2>${opts.title||'Bravo !'}</h2><p>${opts.sub||'Tu as terminé ce jeu.'}</p><div class="won">⭐ +${earned}</div><div class="btns"><button class="btn orange" id="again">Rejouer</button><a class="btn" href="#/jeux">Retour aux jeux</a></div></div>`;
  $('#again').onclick=()=>startGame(id);confetti(earned>0?30:10);
}
/* quiz-like : rounds=[{q, big?, opts:[{h,ok}], mode:'tiles'|'t3'|'list'}] */
function runQuiz(id,rounds,title){
  let i=0,good=0;
  const fb=$('#fb');
  (function show(){
    prog(i/rounds.length);fb.className='fb';fb.innerHTML='';
    const r=rounds[i];const o=shuffle(r.opts);
    let body=`<div class="q">${r.q}</div>${r.big?`<div class="big" lang="ar" dir="rtl">${r.big}</div>`:''}`;
    if(r.mode==='list')body+=`<div class="list">${o.map(x=>`<button class="lopt" data-ok="${x.ok?1:0}">${x.h}</button>`).join('')}</div>`;
    else body+=`<div class="tiles ${r.mode==='t3'?'t3':''}">${o.map((x,k)=>`<button class="opt ${r.txt?'txt':''}" style="${cv(k+i)}" data-ok="${x.ok?1:0}" ${r.big?'':'lang="ar"'} aria-label="${x.al||''}">${x.h}</button>`).join('')}</div>`;
    $('#stage').innerHTML=body;
    let first=true;
    $('#stage').querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.ok==='1';
      $('#stage').querySelectorAll('[data-ok]').forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('good');else if(x!==b)x.classList.add('faded')});
      if(ok){good++;addStars(0)}else b.classList.add('bad');
      const right=r.opts.find(x=>x.ok);
      fb.className='fb show '+(ok?'ok':'no');
      fb.innerHTML=`<div class="t"><b>${ok?['Machaallah !','Bravo !','Super !','Génial !'][i%4]:'Presque !'}</b>${ok?'<span>+1 ⭐</span>':`<span>La bonne réponse : ${r.ans||right.al||right.h}</span>`}</div><button class="btn ${ok?'':'red'}" id="nx">Continuer</button>`;
      if(ok){S.stars++;save();document.querySelectorAll('.pill.sc b').forEach(p=>p.textContent=S.stars)}
      $('#nx').onclick=()=>{i++;if(i<rounds.length)show();else{fb.className='fb';const st=S.stats[id]||{plays:0,best:0};st.plays++;st.best=Math.max(st.best,good);S.stats[id]=st;save();prog(1);
        const k=pick(Object.keys(KIDS),1)[0];
        $('#stage').innerHTML=`<div class="end"><div class="kid">${K(k).replace('<svg','<svg style="width:100%"')}</div><h2>${good>=rounds.length-1?'Machaallah !':'Bien joué !'}</h2><p>${good} bonne${good>1?'s':''} réponse${good>1?'s':''} sur ${rounds.length} du premier coup.</p><div class="won">⭐ +${good}</div><div class="btns"><button class="btn orange" id="again">Rejouer</button><a class="btn" href="#/jeux">Retour aux jeux</a></div></div>`;
        $('#again').onclick=()=>startGame(id);confetti(good*6+6)}};
      $('#nx').focus();
    });
  })();
}

const LET=[['ا','alif'],['ب','ba'],['ت','ta'],['ث','tha'],['ج','jim'],['ح','ha'],['خ','kha'],['د','dal'],['ذ','dhal'],['ر','ra'],['ز','zay'],['س','sin'],['ش','shin'],['ص','sad'],['م','mim'],['ن','noun']];
function gLetters(){
  const rounds=pick(LET,6).map(([l,n])=>{
    const others=pick(LET.filter(x=>x[0]!==l),3);
    return{q:`Touche la lettre « ${n} »`,mode:'tiles',ans:n,opts:[{h:l,ok:1,al:n},...others.map(x=>({h:x[0],ok:0}))]};
  });
  gameShell('letters');runQuiz('letters',rounds);
}

const CONS=[['ب','b'],['ت','t'],['ث','th'],['ج','j'],['د','d'],['ر','r'],['س','s'],['م','m'],['ل','l'],['ن','n'],['ك','k'],['ف','f']];
const VOW=[['َ','a'],['ِ','i'],['ُ','ou']];
function gSound(){
  const rounds=pick(CONS,6).map(([c,s])=>{const [v,vs]=pick(VOW,1)[0];
    return{q:'Quel son fait cette lettre ?',big:c+v,mode:'t3',txt:1,opts:VOW.map(([,x])=>({h:s+x,ok:x===vs,al:s+x}))};
  });
  gameShell('sound');runQuiz('sound',rounds);
}

/* ---- Paires magiques ---- */
function gMemory(){
  const em=pick(['🌙','⭐','🕌','🐪','🌴','🎈','🍉','🌷','🐑','🕋'],6);
  const cards=shuffle([...em,...em]);let open=[],found=0,lock=false,moves=0;
  gameShell('memory',`<div class="mem">${cards.map((c,i)=>`<button class="mt" style="${cv(i)}" data-v="${c}" aria-label="Carte cachée"><i class="fr">?</i><i class="bk">${c}</i></button>`).join('')}</div><div class="msg" id="mm">Coups : 0</div>`);
  $('#stage').querySelectorAll('.mt').forEach(t=>t.onclick=()=>{
    if(lock||t.classList.contains('on'))return;t.classList.add('on');open.push(t);
    if(open.length===2){moves++;$('#mm').textContent='Coups : '+moves;lock=true;const [a,b]=open;
      if(a.dataset.v===b.dataset.v){a.classList.add('m');b.classList.add('m');open=[];lock=false;found++;prog(found/6);
        if(found===6)setTimeout(()=>finish('memory',moves<=9?3:moves<=14?2:1,{sub:`Tu as trouvé toutes les paires en ${moves} coups.`}),700)}
      else setTimeout(()=>{a.classList.remove('on');b.classList.remove('on');open=[];lock=false},800)}
  });
}

/* ---- Éclate les ballons ---- */
function gPop(){
  const sizes=[3,4,5];let level=0;gameShell('pop');
  (function round(){
    const n=sizes[level];prog(level/sizes.length);
    $('#stage').innerHTML=`<div class="q">Touche les ballons dans l'ordre : de 1 à ${n}</div><div class="sky" id="sky"></div>`;
    const sky=$('#sky'),W=sky.clientWidth||320,H=sky.clientHeight;let next=1;const pl=[];
    for(let i=1;i<=n;i++){
      let x,y,t=0;do{x=Math.random()*(W-86)+5;y=Math.random()*(H-130)+10;t++}while(t<40&&pl.some(p=>Math.hypot(p[0]-x,p[1]-y)<86));pl.push([x,y]);
      const b=document.createElement('button');b.className='pb';b.style.cssText=`left:${x}px;top:${y}px;animation-delay:${i*.3}s`;b.setAttribute('aria-label','Ballon '+i);
      b.innerHTML=balloon(BC[(i+level*2)%BC.length],76)+`<span>${i}</span>`;
      b.onclick=()=>{
        if(i!==next){b.classList.remove('wr');void b.offsetWidth;b.classList.add('wr');return}
        b.classList.add('gone');b.disabled=true;next++;
        if(next>n)setTimeout(()=>{if(cur!=='pop')return;level++;if(level<sizes.length)round();else finish('pop',3,{title:'Tous les ballons !',sub:'Tu sais compter jusqu\'à 5.'})},350)};
      sky.appendChild(b);
    }
  })();
}

/* ---- Wudu ---- */
function gWudu(){
  const S8=['Dire « Bismillah »','Laver les mains','Rincer la bouche','Nettoyer le nez','Laver le visage','Laver les bras','Essuyer la tête','Laver les pieds'];
  const E=['🗣️','🙌','👄','👃','😊','💪','🧢','🦶'];let next=0,err=0;
  gameShell('wudu',`<div class="q">Touche les étapes dans le bon ordre !</div><div class="steps">${shuffle(S8.map((s,i)=>i)).map(i=>`<button class="lopt stp" data-i="${i}"><span class="n"></span><span>${E[i]} ${S8[i]}</span></button>`).join('')}</div>`);
  $('#stage').querySelectorAll('.stp').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('good'))return;
    if(+b.dataset.i===next){next++;b.classList.add('good');b.querySelector('.n').textContent=next;prog(next/8);
      if(next===8)setTimeout(()=>finish('wudu',err===0?3:err<3?2:1,{title:'Wudu parfait !',sub:err?`${err} erreur${err>1?'s':''}, tu progresses !`:'Sans aucune erreur !'}),600)}
    else{err++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),500)}
  });
}

/* ---- Couleurs ---- */
function gColor(){
  let sel=BC[0];const pos=[[70,110,50],[145,80,56],[225,115,50],[110,200,48],[190,205,50]];const done=new Set();
  gameShell('color',`<div class="q">Choisis une couleur, puis touche un ballon !</div>
   <div class="pal">${BC.map((c,i)=>`<button class="sw ${i?'':'sel'}" style="background:${c}" data-c="${c}" aria-label="Couleur ${i+1}"></button>`).join('')}</div>
   <svg class="paint" viewBox="0 0 300 330" role="img" aria-label="Cinq ballons à colorier"><rect width="300" height="330" rx="22" fill="#eaf8ff"/>
   ${pos.map(([x,y,r],i)=>`<path d="M${x} ${y+r*1.15}C${x-10} ${y+r*1.8} ${x+10} ${y+r*2} ${x} ${y+r*2.5}" stroke="#3c3c3c" stroke-width="3" fill="none"/><ellipse class="pt" data-i="${i}" cx="${x}" cy="${y}" rx="${r}" ry="${r*1.15}" fill="#fff" stroke="#3c3c3c" stroke-width="4"/>`).join('')}</svg>`);
  $('#stage').querySelectorAll('.sw').forEach(s=>s.onclick=()=>{$('#stage').querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');sel=s.dataset.c});
  $('#stage').querySelectorAll('.pt').forEach(p=>p.onclick=()=>{p.setAttribute('fill',sel);done.add(p.dataset.i);prog(done.size/5);
    if(done.size===5&&!p.dataset.f){p.dataset.f=1;setTimeout(()=>finish('color',2,{title:'Quelles belles couleurs !',sub:'Tes ballons sont magnifiques.'}),700)}});
}

const RUN={letters:gLetters,sound:gSound,memory:gMemory,pop:gPop,wudu:gWudu,quiz:gQuiz,color:gColor};
function startGame(id){cur=id;RUN[id]();window.scrollTo(0,0)}

/* ============ routeur ============ */
function route(){
  const h=location.hash.replace(/^#\/?/,'');cur=null;
  const m=h.match(/^jeu\/(\w+)/);
  if(m&&RUN[m[1]])return startGame(m[1]);
  if(h==='jeux')jeux();else if(h==='etoiles')etoiles();else if(h==='copains')copains();else home();
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){location.hash='#/jeu/'+b.dataset.go}});
window.addEventListener('hashchange',route);
route();
</script>
